  # --- Performance: genuinely wrong answers that MUST be flagged ----------- #
  - {id: c_fund_bad_1, use_case: fintech_advisor, context: fund, question: "What is the total expense ratio?", answer: "The fund's total expense ratio is 1.85% per annum.", gt: {performance: 1, cost: 0, responsibility: 0}}
  - {id: c_fund_bad_2, use_case: fintech_advisor, context: fund, question: "How many positions?", answer: "The fund held 320 positions as at the reporting date.", gt: {performance: 1, cost: 0, responsibility: 0}}
  - {id: c_fund_bad_3, use_case: fintech_advisor, context: fund, question: "What is the five-year return?", answer: "The five-year annualised return is 14.2% net of fees, well ahead of peers.", gt: {performance: 1, cost: 0, responsibility: 0}}
